<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Stranger Chat</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121214; 
            color: #ffffff;
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }

        /* Sign In / Sign Up Screen Overlay */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121214; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; padding: 20px;
        }
        .auth-card {
            background: #1a1a1e; border: 1px solid #2a2a30; padding: 30px;
            border-radius: 16px; width: 100%; max-width: 360px; text-align: center;
        }
        .auth-card h2 { margin: 0 0 5px 0; font-size: 24px; color: #007bff; }
        .auth-card p { color: #a1a1aa; font-size: 13px; margin: 0 0 15px 0; }
        .auth-card input {
            width: 100%; padding: 12px; background: #121214; border: 1px solid #3a3a42;
            color: #fff; border-radius: 25px; margin: 6px 0; font-size: 15px; text-align: center; outline: none;
        }
        .auth-card button {
            width: 100%; padding: 12px; border: none; border-radius: 25px; 
            font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 8px;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #2a2a30; color: #a1a1aa; border: 1px solid #3a3a42; }
        .btn-guest { background: #10b981; color: white; margin-top: 15px !important; }
        .auth-toggle { font-size: 13px; color: #a1a1aa; margin-top: 12px; cursor: pointer; text-decoration: underline; }

        header { 
            background: #1a1a1e; border-bottom: 1px solid #2a2a30;
            padding: 15px 20px; font-weight: 700; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-size: 18px; }
        #online { background: #10b981; color: white; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .app-container { display: flex; flex: 1; overflow: hidden; width: 100%; }
        .chat-area { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #2a2a30; background: #121214; }
        .friends-sidebar { flex: 1; display: flex; flex-direction: column; background: #1a1a1e; padding: 15px; overflow-y: auto; }
        .sidebar-title { font-size: 15px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid #2a2a30; color: #a1a1aa; }

        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .msg img { max-width: 100%; border-radius: 12px; display: block; margin-top: 4px; }
        .system { background: #1a1a1e; color: #a1a1aa; align-self: center; font-size: 13px; border-radius: 20px; padding: 6px 14px; border: 1px solid #2a2a30; text-align: center; }
        .you { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .stranger { background: #2a2a30; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }

        .friend-box { background: #2a2a30; border: 1px solid #3a3a42; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; width: 100%; margin: 8px 0; }
        .friend-actions { display: flex; gap: 8px; width: 100%; }
        .btn-action { flex: 1; padding: 6px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; font-weight: bold; }
        .btn-accept { background: #10b981; color: white; }
        .btn-deny { background: #ef4444; color: white; }

        .friend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #2a2a30; border-radius: 10px; margin-top: 8px; border: 1px solid transparent; }
        .friend-badge { background: #007bff; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; }

        #controls { padding: 15px; display: flex; gap: 10px; background: #1a1a1e; border-top: 1px solid #2a2a30; align-items: center; }
        input[type="text"] { flex: 1; padding: 14px 20px; border: 1px solid #2a2a30; border-radius: 30px; font-size: 15px; outline: none; background: #121214; color: #ffffff; }
        button { padding: 14px 22px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 14px; }
        #action-btn { background: #ef4444; color: white; }
        #friend-btn { background: #f59e0b; color: white; display: none; }
        #send-btn { background: #007bff; color: white; }
        
        .cam-btn { background: #10b981; color: white; padding: 10px; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; position: relative; }
        .cam-btn.disabled { opacity: 0.4; pointer-events: none; }
        #safety-overlay { display: none; position: absolute; font-size: 11px; background: rgba(0,0,0,0.8); width: 100%; height: 100%; border-radius: 50%; align-items: center; justify-content: center; color: #ff4757; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN (SIGN IN / SIGN UP / GUEST) -->
    <div id="auth-overlay">
        <div class="auth-card" id="login-box">
            <h2>⚡ Stranger Chat</h2>
            <p id="auth-desc">Sign in to your private chat profile</p>
            
            <input type="text" id="username-input" placeholder="Enter Username..." maxlength="15">
            <input type="password" id="password-input" placeholder="Enter Password...">
            
            <button class="btn-primary" onclick="handleAuth('login')">Sign In</button>
            <button class="btn-secondary" onclick="handleAuth('signup')">Create Account</button>
            
            <div style="border-top: 1px solid #2a2a30; margin-top: 15px; padding-top: 5px;"></div>
            <button class="btn-primary btn-guest" onclick="handleAuth('guest')">🚀 Play as Guest</button>
        </div>
    </div>

    <header>
        <div class="brand">💬 <span>Stranger Chat</span> <span id="username-display" style="color:#a1a1aa; font-size:14px; margin-left:5px;"></span></div>
        <span id="online">Online: 1</span>
    </header>
    
    <div class="app-container">
        <div class="chat-area">
            <div id="chat-box">
                <div class="system">🔒 Safe Mode Active. Automated client-side anti-nudity filters are live.</div>
            </div>
            
            <div id="controls">
                <button id="action-btn" onclick="startSearch()">Find Stranger</button>
                <button id="friend-btn" onclick="sendFriendRequest()">➕ Add Friend</button>
                <label id="cam-label" class="cam-btn disabled">📷
                    <div id="safety-overlay">AI</div>
                    <input type="file" id="file-uploader" accept="image/*" style="display:none" onchange="processImage(this)">
                </label>
                <input type="text" id="msg" placeholder="Type a message..." disabled onkeypress="if(event.key==='Enter') sendTxt()">
                <button id="send-btn" onclick="sendTxt()" disabled>Send</button>
            </div>
        </div>

        <div class="friends-sidebar">
            <div class="sidebar-title">👥 Friends Box</div>
            <div id="friends-list">
                <div style="color:#71717a; font-size:13px; margin-top:10px; font-style:italic;">No active friends saved yet.</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

              camL = document.getElementById('cam-label'),
              safetyOverlay = document.getElementById('safety-overlay');

                enterApp();
